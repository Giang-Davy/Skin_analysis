<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Caption Website{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">Skin Analysis</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        {% if session.get("user_id") %}
          <li class="nav-item"><a class="nav-link" href="/upload">Upload</a></li>
          <li class="nav-item"><a class="nav-link" href="/images">Images</a></li>
          <li class="nav-item"><a class="nav-link" href="/user-options">Options</a></li>
          <li class="nav-item"><a class="nav-link" href="/logout">Sign Out</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="/">Connection</a></li>
          <li class="nav-item"><a class="nav-link" href="/register">Sign Up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Cookie / GDPR banner for anonymous visitors -->
<div id="gdpr-banner" style="position:fixed;left:0;right:0;bottom:0;background:rgba(248,249,250,0.98);color:#212529;padding:12px;display:none;z-index:2000;border-top:1px solid rgba(0,0,0,0.08);">
  <div class="container d-flex justify-content-between align-items-center">
    <div>We use cookies necessary for the site's operation. By continuing, you accept our <a href="/privacy" style="color:#0d6efd;">privacy policy</a>.</div>
    <div>
      <button id="gdpr-accept" class="btn btn-sm btn-primary">Accepter</button>
    </div>
  </div>
</div>
<script>
  try {
    const consent = localStorage.getItem('gdpr_consent');
    if (!consent) {
      const banner = document.getElementById('gdpr-banner');
      banner.style.display = 'block';
      document.getElementById('gdpr-accept').addEventListener('click', function(){
        localStorage.setItem('gdpr_consent', 'true');
        banner.style.display = 'none';
      });
    }
  } catch(e){}
</script>
</body>
</html>
