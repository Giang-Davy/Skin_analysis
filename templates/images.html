{% extends "base.html" %}
{% block title %}My Images{% endblock %}
{% block content %}
<h2 class="mb-4">Uploaded Images</h2>

<div class="mb-4">
    <a href="/images" class="btn btn-outline-primary active">All</a>
</div>

<form action="/delete_all" method="post" class="mb-4">
    <button type="submit" class="btn btn-danger">Delete all</button>
</form>

<div class="row">
    {% for item in images %}
    <div class="col-md-4 mb-4">
        <div class="card shadow-sm">
            <img src="data:image/jpeg;base64,{{ item.img }}" class="card-img-top">
            <div class="card-body">
                <form action="/edit_caption/{{ item.file_id }}" method="post">
                    <textarea name="new_caption" class="form-control mb-2" rows="3">{{ item.caption }}</textarea>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                </form>
                <form action="/delete/{{ item.file_id }}" method="post" class="mt-2">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
