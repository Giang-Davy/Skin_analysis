{% extends "base.html" %}
{% block title %}Registration{% endblock %}
{% block content %}
<div class="auth-form">
<h2 class="mb-4">Create an account</h2>
{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}
<form action="/register" method="post" class="mx-auto">
    <div class="mb-3">
        <input type="text" name="username" placeholder="User Name" class="form-control" required>
    </div>
    <div class="mb-3">
        <input type="email" name="email" placeholder="Email" class="form-control" required>
    </div>
    <div class="mb-3">
        <input type="password" name="password" placeholder="Password" class="form-control" minlength="8" title="Password must be at least 8 characters long and contain at least one special character" required>
        <div class="form-text">Password must be at least 8 characters long and contain at least one special character.</div>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="gdpr_consent" name="gdpr_consent" required>
        <label class="form-check-label" for="gdpr_consent">I agree to the <a href="/privacy">privacy policy</a>.</label>
    </div>
    <button type="submit" class="btn btn-primary w-100">Sign Up</button>
</form>
<p class="mt-3 text-center">Already registered? <a href="/login">Sign In</a></p>
</div>
{% endblock %}
