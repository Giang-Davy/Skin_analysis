{% extends "base.html" %}
{% block title %}Upload Image{% endblock %}
{% block content %}

<h2 class="mb-4">Upload an Image</h2>

{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}

<form action="/upload" method="post" enctype="multipart/form-data" class="mb-3" onsubmit="showLoading()">
    <div class="upload-card mb-4">
        <div class="upload-card-content">
            <div class="upload-card-text">
                <h3 class="upload-card-title">Upload your image</h3>
                <p class="upload-card-description">Select an image to start the skin analysis.</p>
                <div class="upload-controls">
                    <label for="fileInput" class="btn btn-secondary upload-select-btn">Choose an image</label>
                    <input type="file" id="fileInput" name="file" class="upload-file-input" required>
                    <button type="submit" class="btn btn-primary ms-2">Upload</button>
                    <img src="{{ url_for('static', filename='images/upload-icon.png') }}" alt="">
                </div> 
            </div>
            <div class="upload-icon"></div>
        </div>
    </div>
</form>

<div id="loading" class="mt-4 text-center" style="display: none;">
    <div class="spinner-border text-primary mb-2" role="status"></div>
    <p>Generating caption, please wait...</p>
</div>

<a href="/images" class="btn btn-outline-secondary">View all</a>

<script>
function showLoading() {
    document.getElementById("loading").style.display = "block";
}
</script>


{% endblock %}
