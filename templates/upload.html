{% extends "base.html" %}
{% block title %}Upload Image{% endblock %}
{% block content %}

<h2 class="mb-4">Upload an image</h2>

<form action="/upload" method="post" enctype="multipart/form-data" class="mb-3" onsubmit="showLoading()">
    <div class="mb-3">
        <input type="file" name="file" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary" id="uploadBtn">
        Upload
    </button>
</form>

<div id="loading" class="mt-4 text-center" style="display: none;">
    <div class="spinner-border text-primary mb-2" role="status"></div>
    <p>Generating caption, please wait...</p>
</div>

<a href="/images" class="btn btn-outline-secondary">View all</a>

<script>
function showLoading() {
    document.getElementById("uploadBtn").disabled = true;
    document.getElementById("loading").style.display = "block";
}
</script>

{% endblock %}
